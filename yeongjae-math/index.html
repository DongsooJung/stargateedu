<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>영재고 수학 | STARGATE EDU</title>
<meta name="description" content="2028학년도 영재학교 대수·기하·조합 연습. 자작 문항, 단계 힌트, 오답 다시 풀기." />
<link rel="canonical" href="https://stargateedu.co.kr/yeongjae-math/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --navy: #0b1738;
    --navy-2: #142150;
    --gold: #d9a441;
    --gold-2: #f1c77a;
    --bg: #f3f6fb;
    --card: #fff;
    --text: #1a2138;
    --muted: #66708c;
    --line: #d9e0ec;
    --ok: #0b7b5c;
    --ok-bg: #e7f7f0;
    --bad: #b42318;
    --bad-bg: #fdeceb;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.65;
    word-break: keep-all;
  }
  a { color: inherit; }
  button, input { font: inherit; }
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 23, 56, 0.96);
    color: #fff;
    border-bottom: 1px solid rgba(217, 164, 65, 0.35);
  }
  .top .bar, .wrap { width: min(980px, calc(100% - 28px)); margin: 0 auto; }
  .bar { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-weight: 900; text-decoration: none; letter-spacing: 0.2px; }
  .brand b { color: var(--gold-2); }
  .back { color: #d5def0; font-size: 13px; font-weight: 700; text-decoration: none; }
  .hero { padding: 28px 0 22px; color: #fff; background: linear-gradient(135deg, var(--navy), var(--navy-2)); }
  .eyebrow { color: var(--gold-2); font-size: 12px; font-weight: 900; letter-spacing: 1.4px; }
  h1 { margin: 8px 0 8px; font-size: clamp(28px, 5vw, 42px); line-height: 1.2; }
  .lead { margin: 0; max-width: 680px; color: #d5def0; }
  main { padding: 18px 0 64px; }
  .phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .phase, .card, .problem, .link-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .phase { padding: 14px 14px 12px; }
  .phase.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.18); }
  .phase small, .muted { color: var(--muted); }
  .phase strong, .problem h2, .area h2 { display: block; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .tabs a {
    text-decoration: none;
    border-radius: 999px;
    padding: 8px 14px;
    background: #fff;
    border: 1px solid var(--line);
    font-weight: 800;
    font-size: 14px;
  }
  .tabs a[aria-current="page"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .problem, .card, .link-card { padding: 18px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; background: #eef2f8; font-size: 12px; font-weight: 800; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .prompt { font-size: 18px; font-weight: 700; }
  .hint { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #fff8e8; border: 1px solid #ead092; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--line);
    padding: 0 12px;
    font-size: 16px;
  }
  button, .btn {
    height: 48px;
    border: 0;
    border-radius: 12px;
    padding: 0 14px;
    background: var(--navy);
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.secondary, .btn.secondary { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .result { margin-top: 12px; font-weight: 800; }
  .result.ok { color: var(--ok); }
  .result.bad { color: var(--bad); }
  .solution { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .areas { display: grid; gap: 12px; }
  .topic { margin-top: 12px; }
  .topic p { margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
  .problem-row {
    width: 100%;
    height: auto;
    min-height: 48px;
    margin-top: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    text-align: left;
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--line);
  }
  .links { display: grid; gap: 10px; }
  .link-card { display: block; text-decoration: none; }
  .link-card strong { display: block; }
  .link-card span { color: var(--muted); font-size: 14px; }
  .empty { padding: 28px 8px; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  @media (max-width: 760px) {
    .phases { grid-template-columns: 1fr; }
    form, .actions { display: grid; }
    button, .btn, input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="bar">
      <a class="brand" href="/">STARGATE <b>EDU</b></a>
      <a class="back" href="/koi-coach/">KOI Coach</a>
    </div>
  </header>
  <section class="hero">
    <div class="wrap">
      <div class="eyebrow">2028 영재학교 · 코호트 A</div>
      <h1>영재고 수학</h1>
      <p class="lead">대수, 기하, 조합을 자작 문항으로 연습합니다. 힌트는 한 단계씩 열리고, 풀이는 답을 확인한 뒤에만 볼 수 있습니다. 진도는 이 브라우저에만 남습니다.</p>
    </div>
  </section>
  <main>
    <div class="wrap">
      <section class="phases" id="phases" aria-label="시즌 단계"></section>
      <nav class="tabs" id="tabs" aria-label="연습 메뉴">
        <a href="#today">오늘</a>
        <a href="#tracks">트랙</a>
        <a href="#wrong">오답</a>
        <a href="#links">연결</a>
      </nav>
      <section id="view" aria-live="polite"></section>
      <footer id="source"></footer>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
