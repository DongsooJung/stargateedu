<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARGATE Survey Lab Dashboard</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#182038}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}.hero{background:#0b1738;color:#fff;padding:44px 0}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#cfd6e9}.nav{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.nav a{color:#0b1738;background:#d9a441;padding:9px 13px;border-radius:10px;text-decoration:none;font-weight:700}.content{padding:28px 0 60px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e3e8f2;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(11,23,56,.05)}.big{font-size:32px;font-weight:800;color:#0b1738}.muted{color:#6b7594;font-size:13px}.section{margin-top:20px}.section h2{font-size:20px}.rows{display:grid;gap:9px}.row{background:#fff;border:1px solid #e3e8f2;border-radius:12px;padding:13px 15px;display:flex;justify-content:space-between;gap:14px}.bar{height:8px;background:#e8ebf2;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#d9a441}.status{margin-top:15px;color:#6b7594;font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><h1>STARGATE Survey Lab Dashboard</h1><p>AI·교육시장 파일럿 설문의 익명 집계 현황입니다. 원시 응답과 연락처는 공개하지 않습니다.</p><div class="nav"><a href="/research/survey/">설문 참여</a><a href="/research/">연구 허브</a></div></div></header><main class="content wrap"><div class="grid"><div class="card"><div class="muted">유효 제출 표본</div><div class="big" id="n">—</div></div><div class="card"><div class="muted">평균 응답시간</div><div class="big" id="duration">—</div></div><div class="card"><div class="muted">가격 실험군</div><div class="big">3</div><div class="muted">49K · 99K · 149K</div></div></div><section class="section"><h2>가격별 구매의향</h2><div id="prices" class="rows"></div></section><section class="section"><h2>응답자 역할</h2><div id="roles" class="rows"></div></section><section class="section"><h2>관심 학습분야</h2><div id="topics" class="rows"></div></section><div class="status" id="status">집계 데이터를 불러오는 중입니다.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=window.supabase.createClient('https://flxntafmvcdhpagzrvii.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZseG50YWZtdmNkaHBhZ3pydmlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMzc2NjgsImV4cCI6MjA3NzkxMzY2OH0.JOqS4I18z1al-omPSgRQor-eUx2Qd-IhT-6aAAtdDl8',{auth:{persistSession:false}});function rows(el,data,labelFn,valueFn){const root=document.getElementById(el);if(!data?.length){root.innerHTML='<div class="row"><span class="muted">아직 데이터가 없습니다.</span></div>';return}const max=Math.max(...data.map(x=>Number(x.n)||0),1);root.innerHTML=data.map(x=>`<div class="row"><div style="flex:1"><strong>${labelFn(x)}</strong><div class="bar"><div class="fill" style="width:${Math.round((Number(x.n)||0)/max*100)}%"></div></div></div><div>${valueFn(x)}</div></div>`).join('')}async function load(){const {data,error}=await c.rpc('get_survey_dashboard',{p_slug:'ai-education-market-2026'});if(error){document.getElementById('status').textContent='집계 조회 실패';return}document.getElementById('n').textContent=Number(data.submitted_n||0).toLocaleString('ko-KR');document.getElementById('duration').textContent=data.avg_duration_sec?Math.round(data.avg_duration_sec)+'초':'—';rows('prices',data.price_groups,x=>Number(x.price).toLocaleString('ko-KR')+'원',x=>`n=${x.n} · 평균 ${x.avg_buy_intent??'—'}/5`);rows('roles',data.roles,x=>x.label,x=>`n=${x.n}`);rows('topics',data.topics,x=>x.label,x=>`n=${x.n}`);document.getElementById('status').textContent='최근 집계: '+new Date(data.updated_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}load();</script></body></html>
