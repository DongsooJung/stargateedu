name: Deploy STARGATE EDU to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GA4 runtime config
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID || secrets.GA4_MEASUREMENT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          measurement_id = os.getenv('GA4_MEASUREMENT_ID', '').strip()
          Path('assets').mkdir(exist_ok=True)
          payload = {'measurement_id': measurement_id}
          Path('assets/analytics-config.js').write_text(
              'window.STARGATE_ANALYTICS = ' + json.dumps(payload) + ';\n',
              encoding='utf-8'
          )
          print('GA4 runtime config:', 'configured' if measurement_id else 'credential pending')
          PY

      - name: Inject analytics loader into HTML
        run: python scripts/inject-analytics.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
