name: Update Notion project status

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-workspace-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Notion API
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_IDS: ${{ vars.NOTION_DATA_SOURCE_IDS }}
        run: node scripts/update-workspace-status.mjs

      - name: Commit refreshed snapshot
        id: snapshot
        run: |
          if git diff --quiet -- pmo/data/latest.json; then
            echo "No workspace status changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "stargate-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- pmo/data/latest.json
          git commit -m "data: refresh Notion project status"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
