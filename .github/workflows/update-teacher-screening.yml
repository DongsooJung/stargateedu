name: Update teacher screening dashboard

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-teacher-screening
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Screen up to 100 authorized candidates
        env:
          AUTHORIZED_CANDIDATE_EXPORT_URL: ${{ secrets.AUTHORIZED_CANDIDATE_EXPORT_URL }}
        run: node scripts/update-teacher-screening.mjs

      - name: Commit updated dashboard data
        run: |
          if git diff --quiet -- teacher-screening/data/latest.json; then
            echo "No screening changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-screening/data/latest.json
          git commit -m "data: update weekly teacher screening"
          git push
