name: Update Drive Knowledge Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-drive-blog.py'
      - '.github/workflows/update-drive-blog.yml'
  schedule:
    # Every 6 hours. GitHub schedules use UTC and may start a few minutes late.
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: drive-knowledge-archive-sync
  cancel-in-progress: true

env:
  DRIVE_BLOG_FOLDER_ID: 18wK4G_-jzJHsLsvM3Ka5oWjrQChoK9Y4
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  # OpenAI-compatible AI layer. Prefer generic names, but transparently reuse
  # an existing DeepSeek secret when the generic AI_API_KEY is not configured.
  AI_API_BASE: ${{ vars.AI_API_BASE || 'https://api.deepseek.com' }}
  AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
  AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate when Google Cloud identity exists
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Drive sync dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth requests beautifulsoup4 pypdf

      - name: Report AI provider readiness
        run: |
          python - <<'PY'
          import os
          key = bool(os.getenv('AI_API_KEY', '').strip())
          base = os.getenv('AI_API_BASE', '').strip()
          model = os.getenv('AI_MODEL', '').strip()
          print('AI provider:', 'configured' if key else 'credential missing')
          print('AI base:', base or 'unset')
          print('AI model:', model or 'unset')
          PY

      - name: Refresh and enrich Drive archive index
        run: python scripts/update-drive-blog.py

      - name: Validate generated index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('drive-blog/data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          docs = data.get('documents', [])
          assert data.get('source', {}).get('folderId') == '18wK4G_-jzJHsLsvM3Ka5oWjrQChoK9Y4'
          assert data.get('version', 0) >= 3
          assert len(docs) >= 1, 'Drive archive index unexpectedly empty'
          assert all(d.get('id') and d.get('title') and d.get('url') for d in docs)
          assert all(d.get('smartSummary') and len(d.get('keyPoints', [])) == 3 for d in docs)
          assert all(d.get('audience') and d.get('relatedProjects') for d in docs)
          enrichment = data.get('enrichment', {})
          print(
              f"Validated {len(docs)} Drive documents via {data.get('source', {}).get('syncMethod', 'unknown')} | "
              f"AI={enrichment.get('aiDocuments', 0)} heuristic={enrichment.get('heuristicDocuments', 0)}"
          )
          PY

      - name: Commit archive snapshot when changed
        id: commit_archive
        run: |
          git add drive-blog/data.json
          if git diff --cached --quiet; then
            echo 'No Drive/enrichment changes to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'stargate-drive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: refresh enriched Drive knowledge archive'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Redeploy Pages after archive change
        if: ${{ steps.commit_archive.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Publish sync summary
        if: always()
        run: |
          {
            echo '## Drive Knowledge Archive P2'
            echo
            echo '- Folder: `스타게이트_공개블로그`'
            echo '- Index: `drive-blog/data.json`'
            echo '- Schedule: every 6 hours'
            echo '- Changed: `${{ steps.commit_archive.outputs.changed || 'unknown' }}`'
            if [ -f drive-blog/data.json ]; then
              python - <<'PY'
          import json
          data = json.load(open('drive-blog/data.json', encoding='utf-8'))
          enrichment = data.get('enrichment', {})
          print(f"- Documents: {len(data.get('documents', []))}")
          print(f"- Sync method: {data.get('source', {}).get('syncMethod', 'unknown')}")
          print(f"- AI configured: {enrichment.get('aiConfigured', False)}")
          print(f"- AI enriched: {enrichment.get('aiDocuments', 0)}")
          print(f"- Heuristic enriched: {enrichment.get('heuristicDocuments', 0)}")
          print(f"- Model: {enrichment.get('model') or 'none'}")
          print(f"- Generated: {data.get('generatedAt', 'unknown')}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
