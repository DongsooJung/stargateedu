name: Update Drive Knowledge Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-drive-blog.py'
      - '.github/workflows/update-drive-blog.yml'
  schedule:
    # Every 6 hours. GitHub schedules use UTC and may start a few minutes late.
    - cron: '17 */6 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: drive-knowledge-archive-sync
  cancel-in-progress: true

env:
  DRIVE_BLOG_FOLDER_ID: 18wK4G_-jzJHsLsvM3Ka5oWjrQChoK9Y4
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate with existing Google Cloud identity
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Drive API client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Refresh Drive archive index
        run: python scripts/update-drive-blog.py

      - name: Validate generated index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('drive-blog/data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          docs = data.get('documents', [])
          assert data.get('source', {}).get('folderId') == '18wK4G_-jzJHsLsvM3Ka5oWjrQChoK9Y4'
          assert len(docs) >= 1, 'Drive archive index unexpectedly empty'
          assert all(d.get('id') and d.get('title') and d.get('url') for d in docs)
          print(f'Validated {len(docs)} public Drive documents')
          PY

      - name: Commit archive snapshot when changed
        run: |
          git add drive-blog/data.json
          if git diff --cached --quiet; then
            echo 'No Drive metadata changes to commit.'
            exit 0
          fi
          git config user.name 'stargate-drive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: refresh Drive knowledge archive'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish sync summary
        if: always()
        run: |
          {
            echo '## Drive Knowledge Archive'
            echo
            echo '- Folder: `스타게이트_공개블로그`'
            echo '- Index: `drive-blog/data.json`'
            echo '- Schedule: every 6 hours'
            if [ -f drive-blog/data.json ]; then
              python - <<'PY'
          import json
          data = json.load(open('drive-blog/data.json', encoding='utf-8'))
          print(f"- Documents: {len(data.get('documents', []))}")
          print(f"- Generated: {data.get('generatedAt', 'unknown')}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
