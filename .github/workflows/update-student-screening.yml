name: Update student screening dashboard

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-student-screening
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect and screen authorized inquiries in 100-row pages
        env:
          AUTHORIZED_STUDENT_EXPORT_URL: ${{ secrets.AUTHORIZED_STUDENT_EXPORT_URL }}
        run: node scripts/update-student-screening.mjs

      - name: Save screening history to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-student-screening-to-supabase.mjs

      - name: Commit updated dashboard data
        run: |
          if git diff --quiet -- teacher-screening/data/latest.json; then
            echo "No screening changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-screening/data/latest.json
          git commit -m "data: update weekly student screening"
          git push
