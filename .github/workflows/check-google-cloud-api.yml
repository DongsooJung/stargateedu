name: Check Google Cloud API

on:
  pull_request:
    paths:
      - 'google-cloud-api/**'
      - '.github/workflows/check-google-cloud-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google-cloud-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: google-cloud-api/package-lock.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
