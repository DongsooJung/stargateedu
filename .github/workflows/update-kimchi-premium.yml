name: Update kimchi premium radar

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-kimchi-premium.mjs"
      - ".github/workflows/update-kimchi-premium.yml"

permissions:
  contents: write

concurrency:
  group: update-kimchi-premium
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild kimchi premium data
        run: node scripts/update-kimchi-premium.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- research/kimchi-premium/data/latest.json; then
            echo "No kimchi premium changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/kimchi-premium/data/latest.json
          git commit -m "data: update kimchi premium radar"
          git pull --rebase origin main
          git push
