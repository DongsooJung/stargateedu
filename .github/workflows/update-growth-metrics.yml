name: Update Growth Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-growth-metrics.py'
      - '.github/workflows/update-growth-metrics.yml'
  schedule:
    # 07:20 KST every day
    - cron: '20 22 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: growth-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with existing Google Cloud identity
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google API clients
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data google-api-python-client google-auth

      - name: Update growth metrics
        run: python scripts/update-growth-metrics.py

      - name: Commit metric snapshot
        run: |
          if git diff --quiet -- strategy/growth-control/data.json; then
            echo 'No metric changes to commit.'
            exit 0
          fi
          git config user.name 'stargate-growth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add strategy/growth-control/data.json
          git commit -m 'chore: refresh growth metrics'
          git push
